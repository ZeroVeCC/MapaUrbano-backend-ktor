openapi: 3.0.3
info:
  title: Mapa Urbano API
  version: 2.0.0
  description: |-
    Contrato HTTP y WebSocket del backend Ktor de Mapa Urbano.

    La autenticación ciudadana vigente usa **DNI + contraseña**. El login devuelve
    un token opaco que debe enviarse como `Authorization: Bearer <token>`.

    Todos los endpoints documentados están implementados. Los vecinos solo acceden
    a sus propios reportes. La API administrativa usa una cookie HttpOnly persistida;
    login y `/me` entregan `csrfToken`, que debe enviarse como `X-CSRF-Token` en
    toda operación administrativa que modifique datos.

    Los WebSockets aparecen como handshakes HTTP 101. Swagger UI no abre conexiones
    WebSocket; los clientes deben obtener el estado inicial por REST y escuchar luego
    los eventos descritos en `WsEvent`.
  contact:
    name: Equipo Mapa Urbano
servers:
  - url: /
    description: Mismo host y puerto desde el que se abrió Swagger UI
security: []
tags:
  - name: Estado del servidor
    description: Comprobaciones de vida y disponibilidad del proceso.
  - name: Categorías públicas
    description: Catálogo visible para los clientes ciudadanos.
  - name: Cuenta ciudadana
    description: Registro, sesión y datos propios mediante DNI y token Bearer.
  - name: Tiempo real
    description: Handshakes y eventos WebSocket.
  - name: Autenticación administrativa
    description: Sesión persistida por cookie para el panel web.
  - name: Reportes administrativos
    description: Gestión interna de reportes.
  - name: Equipos y asignaciones
    description: Equipos, miembros, responsables y asignaciones.
  - name: Categorías administrativas
    description: Gestión del catálogo de categorías.
  - name: Estadísticas
    description: Agregados para el panel administrativo.
  - name: Auditoría
    description: Trazabilidad de operaciones administrativas.
paths:
  /health/live:
    get:
      tags: [Estado del servidor]
      operationId: getLiveness
      summary: Comprobar que el proceso está vivo
      x-implementation-status: implemented
      responses:
        '200':
          description: El proceso está ejecutándose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
  /health/ready:
    get:
      tags: [Estado del servidor]
      operationId: getReadiness
      summary: Comprobar que el proceso está listo
      description: Ejecuta una consulta mínima contra PostgreSQL.
      x-implementation-status: implemented
      responses:
        '200':
          description: La base de datos está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: La base de datos no está disponible.
  /api/v1/categories:
    get:
      tags: [Categorías públicas]
      operationId: listPublicCategories
      summary: Listar categorías activas
      x-implementation-status: implemented
      responses:
        '200':
          description: Catálogo ordenado de categorías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 1f6d61d5-a404-4e7f-a969-882b75148623
                  slug: bache
                  name: Bache
                  colorHex: '#E67E22'
                  isActive: true
                  sortOrder: 10
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/reports:
    post:
      tags: [Cuenta ciudadana]
      operationId: createReport
      summary: Crear un reporte ciudadano
      description: |-
        Recibe `multipart/form-data`, exige un token ciudadano válido y siempre asocia
        el reporte a esa cuenta. `submissionMode`, si se envía, debe ser `ACCOUNT`.
        El campo de archivo se llama exactamente `image`.

        La imagen se valida por firma, tamaño y dimensiones antes de crear el reporte.
      x-implementation-status: implemented
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateReportMultipart'
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Reporte creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReportResponse'
              example:
                id: c8bf2db1-c9fb-43bc-8ab7-86f83f77f7d2
                submissionMode: ACCOUNT
                status: PENDING
                createdAt: '2026-10-14T18:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/register:
    post:
      tags: [Cuenta ciudadana]
      operationId: registerCitizen
      summary: Registrar una persona y crear su sesión
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              dni: '30.123.456'
              displayName: Juan Pérez
              password: clave-segura-2026
      responses:
        '201':
          description: Cuenta creada; el token opaco se entrega una sola vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El DNI ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              example:
                error:
                  code: DNI_ALREADY_REGISTERED
                  message: El DNI ya se encuentra registrado.
                  details: []
                  requestId: 7d00b765-56db-43fd-8447-0a910a9861dc
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/login:
    post:
      tags: [Cuenta ciudadana]
      operationId: loginCitizen
      summary: Iniciar sesión con DNI y contraseña
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              dni: '30123456'
              password: clave-segura-2026
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/logout:
    post:
      tags: [Cuenta ciudadana]
      operationId: logoutCitizen
      summary: Revocar el token ciudadano actual
      x-implementation-status: implemented
      security:
        - userBearer: []
      responses:
        '204':
          description: Sesión revocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me:
    get:
      tags: [Cuenta ciudadana]
      operationId: getCitizenProfile
      summary: Consultar el perfil propio
      x-implementation-status: implemented
      security:
        - userBearer: []
      responses:
        '200':
          description: Perfil privado de la sesión actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cuenta ciudadana]
      operationId: deactivateCitizenAccount
      summary: Desactivar la cuenta propia
      description: Desactiva la cuenta y revoca todas sus sesiones.
      x-implementation-status: implemented
      security:
        - userBearer: []
      responses:
        '204':
          description: Cuenta desactivada y sesiones revocadas.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/reports:
    get:
      tags: [Cuenta ciudadana]
      operationId: listOwnReports
      summary: Listar reportes asociados a la cuenta actual
      description: Devuelve únicamente reportes de la cuenta autenticada, con cursor por fecha, categoría e indicador de imagen reales.
      x-implementation-status: implemented
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de reportes pertenecientes a la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPublicPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/reports/{id}:
    get:
      tags: [Cuenta ciudadana]
      operationId: getOwnReport
      summary: Consultar el detalle de un reporte propio
      x-implementation-status: implemented
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Detalle del reporte propio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPublicDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/me/reports/{id}/image:
    get:
      tags: [Cuenta ciudadana]
      operationId: getOwnReportImage
      summary: Descargar la imagen de un reporte propio
      x-implementation-status: implemented
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Evidencia binaria con su Content-Type original.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/ws/admin:
    get:
      tags: [Tiempo real]
      operationId: connectAdminWebSocket
      summary: Abrir el canal administrativo de eventos
      description: Requiere una cookie administrativa vigente.
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      x-websocket-events:
        schema:
          $ref: '#/components/schemas/WsEvent'
        server-to-client:
          - connected
          - report.created
          - report.updated
          - report.assignment_changed
          - report.priority_changed
          - report.deleted
          - statistics.updated
          - heartbeat
          - error
      responses:
        '101':
          description: Protocolo cambiado a WebSocket.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/auth/login:
    post:
      tags: [Autenticación administrativa]
      operationId: loginAdmin
      summary: Iniciar sesión administrativa
      description: Valida credenciales, crea una sesión persistida y emite una cookie HttpOnly.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Datos del administrador y token CSRF; la cookie se emite en Set-Cookie.
          headers:
            Set-Cookie:
              description: Cookie de sesión administrativa.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/auth/logout:
    post:
      tags: [Autenticación administrativa]
      operationId: logoutAdmin
      summary: Cerrar la sesión administrativa
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Sesión administrativa cerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/auth/me:
    get:
      tags: [Autenticación administrativa]
      operationId: getAdminProfile
      summary: Consultar la sesión administrativa actual
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      responses:
        '200':
          description: Administrador de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/reports:
    get:
      tags: [Reportes administrativos]
      operationId: listAdminReports
      summary: Listar reportes para el panel administrativo
      description: Lista global para el panel con filtros, búsqueda y cursor.
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportStatusQuery'
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/ReportPriority'
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: responsibleAdminUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Listado administrativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAdminPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/reports/{id}:
    get:
      tags: [Reportes administrativos]
      operationId: getAdminReport
      summary: Consultar el detalle administrativo de un reporte
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Detalle administrativo con historiales y asignación activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAdminDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Reportes administrativos]
      operationId: deleteAdminReport
      summary: Eliminar lógicamente un reporte
      description: Conserva el historial relacionado y oculta el reporte de las consultas activas.
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Reporte eliminado lógicamente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/reports/{id}/image:
    get:
      tags: [Reportes administrativos]
      operationId: getAdminReportImage
      summary: Descargar la evidencia de cualquier reporte
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Evidencia binaria con su Content-Type original.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/reports/{id}/status:
    patch:
      tags: [Reportes administrativos]
      operationId: updateReportStatus
      summary: Cambiar el estado de un reporte
      description: Usa control optimista mediante `version`, registra historial y publica un evento.
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Cambio aplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/reports/{id}/priority:
    patch:
      tags: [Reportes administrativos]
      operationId: updateReportPriority
      summary: Cambiar prioridad y fecha objetivo
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePriorityRequest'
      responses:
        '200':
          description: Prioridad actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/reports/{id}/assignment:
    put:
      tags: [Equipos y asignaciones]
      operationId: assignReport
      summary: Asignar un reporte a equipo o responsable
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '204':
          description: Asignación creada o reemplazada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Equipos y asignaciones]
      operationId: unassignReport
      summary: Quitar la asignación de un reporte
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: version
          in: query
          required: true
          description: Versión esperada para el control optimista.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '204':
          description: Asignación eliminada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/teams:
    get:
      tags: [Equipos y asignaciones]
      operationId: listTeams
      summary: Listar equipos
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      responses:
        '200':
          description: Equipos actuales.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Equipos y asignaciones]
      operationId: createTeam
      summary: Crear un equipo
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Equipo creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/teams/{id}:
    get:
      tags: [Equipos y asignaciones]
      operationId: getTeam
      summary: Consultar un equipo con sus miembros
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Equipo con sus miembros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Equipos y asignaciones]
      operationId: updateTeam
      summary: Modificar un equipo
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Equipo actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/teams/{teamId}/members/{adminUserId}:
    parameters:
      - $ref: '#/components/parameters/TeamIdNamed'
      - $ref: '#/components/parameters/AdminUserId'
      - $ref: '#/components/parameters/CsrfToken'
    put:
      tags: [Equipos y asignaciones]
      operationId: addTeamMember
      summary: Agregar un administrador a un equipo
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      responses:
        '204':
          description: Miembro agregado; repetir la operación es idempotente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Equipos y asignaciones]
      operationId: removeTeamMember
      summary: Quitar un administrador de un equipo
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      responses:
        '204':
          description: Miembro quitado; repetir la operación es idempotente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/assignees:
    get:
      tags: [Equipos y asignaciones]
      operationId: listAssignees
      summary: Listar responsables posibles
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      responses:
        '200':
          description: Administradores activos con sus equipos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignee'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/categories:
    get:
      tags: [Categorías administrativas]
      operationId: listAdminCategories
      summary: Listar todas las categorías
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      responses:
        '200':
          description: Catálogo completo para administración.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Categorías administrativas]
      operationId: createCategory
      summary: Crear una categoría
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Categoría creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/categories/{id}:
    patch:
      tags: [Categorías administrativas]
      operationId: updateCategory
      summary: Modificar una categoría
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/statistics:
    get:
      tags: [Estadísticas]
      operationId: getStatistics
      summary: Obtener agregados administrativos
      description: Calcula los agregados sobre los reportes activos en PostgreSQL.
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      responses:
        '200':
          description: Estadísticas actuales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
              example:
                totalReports: 0
                byStatus: {}
                byCategory: []
                byPriority: {}
                byTeam: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/audit:
    get:
      tags: [Auditoría]
      operationId: listAuditEvents
      summary: Listar eventos de auditoría
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de eventos de auditoría.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: Token opaco de 30 días entregado por registro o login. No es el DNI ni el UUID del usuario.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: mapa_urbano_admin
      description: Cookie HttpOnly emitida por el login administrativo.
  parameters:
    ReportId:
      name: id
      in: path
      required: true
      description: UUID del reporte.
      schema:
        type: string
        format: uuid
    TeamId:
      name: id
      in: path
      required: true
      description: UUID del equipo.
      schema:
        type: string
        format: uuid
    TeamIdNamed:
      name: teamId
      in: path
      required: true
      description: UUID del equipo.
      schema:
        type: string
        format: uuid
    AdminUserId:
      name: adminUserId
      in: path
      required: true
      description: UUID del administrador.
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      description: UUID de la categoría.
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token devuelto por login o por GET /api/v1/admin/auth/me.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto por la página anterior.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MinLat:
      name: minLat
      in: query
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
        default: -90
    MinLng:
      name: minLng
      in: query
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
        default: -180
    MaxLat:
      name: maxLat
      in: query
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
        default: 90
    MaxLng:
      name: maxLng
      in: query
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
        default: 180
    ReportStatusQuery:
      name: status
      in: query
      description: Estado; la implementación acepta el texto sin distinguir mayúsculas y minúsculas.
      schema:
        $ref: '#/components/schemas/ReportStatus'
  responses:
    BadRequest:
      description: Parámetros, cuerpo o reglas de negocio inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            error:
              code: VALIDATION_ERROR
              message: Hay datos inválidos.
              details:
                - field: latitude
                  reason: Debe estar entre -90 y 90.
              requestId: 7d00b765-56db-43fd-8447-0a910a9861dc
    Unauthorized:
      description: Credenciales o sesión ausentes, inválidas, vencidas o revocadas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    Forbidden:
      description: Token CSRF ausente o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    NotFound:
      description: El recurso solicitado no existe o no es visible para la sesión.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    Conflict:
      description: Duplicado, transición inválida o conflicto de versión optimista.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    TooManyRequests:
      description: Se superó el límite de solicitudes. El cuerpo del limitador actual no es un contrato estable.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar, si el servidor lo informa.
          schema:
            type: integer
    InternalError:
      description: Fallo interno traducido a un mensaje controlado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: No pudimos procesar la solicitud.
              details: []
              requestId: 7d00b765-56db-43fd-8447-0a910a9861dc
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    ReportStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, RESOLVED]
      example: PENDING
    ReportPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
      example: MEDIUM
    SubmissionMode:
      type: string
      description: Los reportes nuevos son ACCOUNT; ANONYMOUS solo puede aparecer en datos históricos administrativos.
      enum: [ACCOUNT, ANONYMOUS]
      example: ACCOUNT
    AccountSubmissionMode:
      type: string
      description: Modo admitido al crear reportes nuevos.
      enum: [ACCOUNT]
      example: ACCOUNT
    ApiErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Hay datos inválidos.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
        requestId:
          type: string
          example: 7d00b765-56db-43fd-8447-0a910a9861dc
    ApiErrorDetail:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        field:
          type: string
          nullable: true
        reason:
          type: string
    Category:
      type: object
      additionalProperties: false
      required: [id, slug, name, colorHex, isActive, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          example: bache
        name:
          type: string
          example: Bache
        colorHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#E67E22'
        isActive:
          type: boolean
        sortOrder:
          type: integer
          format: int32
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [slug, name, colorHex]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        name:
          type: string
        colorHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        sortOrder:
          type: integer
          format: int32
          nullable: true
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
        colorHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
        isActive:
          type: boolean
          nullable: true
        sortOrder:
          type: integer
          format: int32
          nullable: true
    CreateReportMultipart:
      type: object
      additionalProperties: false
      required: [title, description, categorySlug, latitude, longitude]
      properties:
        title:
          type: string
          minLength: 1
          example: Luminaria apagada
        description:
          type: string
          minLength: 1
          example: La luminaria no funciona desde hace tres noches.
        categorySlug:
          type: string
          example: luminaria
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -32.8895
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -68.8458
        submissionMode:
          $ref: '#/components/schemas/AccountSubmissionMode'
        image:
          type: string
          format: binary
          description: Archivo opcional. El nombre de la parte debe ser `image`.
    CreateReportResponse:
      type: object
      additionalProperties: false
      required: [id, submissionMode, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        submissionMode:
          $ref: '#/components/schemas/AccountSubmissionMode'
        status:
          $ref: '#/components/schemas/ReportStatus'
        createdAt:
          type: string
          format: date-time
    ReportPublicSummary:
      type: object
      additionalProperties: false
      required: [id, title, categorySlug, latitude, longitude, status, hasImage, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        categorySlug:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/ReportStatus'
        hasImage:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReportPublicDetail:
      allOf:
        - $ref: '#/components/schemas/ReportPublicSummary'
        - type: object
          required: [description, categoryName, statusHistory]
          properties:
            description:
              type: string
            categoryName:
              type: string
            statusHistory:
              type: array
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
    StatusHistoryEntry:
      type: object
      additionalProperties: false
      required: [toStatus, changedAt]
      properties:
        fromStatus:
          type: string
          enum: [PENDING, IN_PROGRESS, RESOLVED]
          nullable: true
        toStatus:
          $ref: '#/components/schemas/ReportStatus'
        changedAt:
          type: string
          format: date-time
    ReportPublicPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportPublicSummary'
        nextCursor:
          type: string
          nullable: true
        totalCount:
          type: integer
          format: int64
          nullable: true
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [dni, displayName, password]
      properties:
        dni:
          type: string
          example: '30.123.456'
          description: Se normaliza a 7 u 8 dígitos; acepta puntos agrupados y espacios exteriores, y rechaza todos ceros.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: Máximo 72 bytes UTF-8 por el límite de BCrypt.
    RegisterResponse:
      type: object
      additionalProperties: false
      required: [id, token]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Token opaco para Authorization Bearer.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [dni, password]
      properties:
        dni:
          type: string
          example: '30123456'
        password:
          type: string
          format: password
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, userId]
      properties:
        token:
          type: string
        userId:
          type: string
          format: uuid
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        dni:
          type: string
          nullable: true
          pattern: '^[0-9]{7,8}$'
        createdAt:
          type: string
          format: date-time
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    AdminLoginResponse:
      type: object
      additionalProperties: false
      required: [adminUserId, username, csrfToken]
      properties:
        adminUserId:
          type: string
          format: uuid
        username:
          type: string
        csrfToken:
          type: string
    AdminSessionResponse:
      type: object
      additionalProperties: false
      required: [adminUserId, username, csrfToken]
      properties:
        adminUserId:
          type: string
          format: uuid
        username:
          type: string
        csrfToken:
          type: string
    UpdateStatusRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          $ref: '#/components/schemas/ReportStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        note:
          type: string
          nullable: true
    UpdatePriorityRequest:
      type: object
      additionalProperties: false
      required: [priority, version]
      properties:
        priority:
          $ref: '#/components/schemas/ReportPriority'
        dueAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
    AssignmentRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        teamId:
          type: string
          format: uuid
          nullable: true
        responsibleAdminUserId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
    ReportMutationResponse:
      type: object
      additionalProperties: false
      required: [id, status, priority, version, updatedAt]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ReportStatus'}
        priority: {$ref: '#/components/schemas/ReportPriority'}
        dueAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
    ReportAdminSummary:
      type: object
      additionalProperties: false
      required: [id, title, categorySlug, categoryName, status, priority, latitude, longitude, hasImage, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        categorySlug: {type: string}
        categoryName: {type: string}
        status: {$ref: '#/components/schemas/ReportStatus'}
        priority: {$ref: '#/components/schemas/ReportPriority'}
        dueAt: {type: string, format: date-time, nullable: true}
        teamName: {type: string, nullable: true}
        responsibleAdminName: {type: string, nullable: true}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        hasImage: {type: boolean}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ReportAdminDetail:
      type: object
      additionalProperties: false
      required: [id, title, description, categorySlug, categoryName, status, priority, submissionMode, latitude, longitude, hasImage, version, createdAt, updatedAt, statusHistory, priorityHistory]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        categorySlug: {type: string}
        categoryName: {type: string}
        status: {$ref: '#/components/schemas/ReportStatus'}
        priority: {$ref: '#/components/schemas/ReportPriority'}
        dueAt: {type: string, format: date-time, nullable: true}
        submissionMode: {$ref: '#/components/schemas/SubmissionMode'}
        assignment:
          type: object
          allOf:
            - $ref: '#/components/schemas/AssignmentInfo'
          nullable: true
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        hasImage: {type: boolean}
        imageChecksum: {type: string, nullable: true}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        statusHistory:
          type: array
          items: {$ref: '#/components/schemas/AdminStatusHistoryEntry'}
        priorityHistory:
          type: array
          items: {$ref: '#/components/schemas/PriorityHistoryEntry'}
    ReportAdminPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReportAdminSummary'}
        nextCursor: {type: string, nullable: true}
        totalCount: {type: integer, format: int64, nullable: true}
    AssignmentInfo:
      type: object
      additionalProperties: false
      required: [assignedBy, assignedAt]
      properties:
        teamId: {type: string, format: uuid, nullable: true}
        teamName: {type: string, nullable: true}
        responsibleAdminUserId: {type: string, format: uuid, nullable: true}
        responsibleAdminName: {type: string, nullable: true}
        assignedBy: {type: string, format: uuid}
        assignedAt: {type: string, format: date-time}
    AdminStatusHistoryEntry:
      type: object
      additionalProperties: false
      required: [toStatus, changedAt]
      properties:
        fromStatus:
          type: string
          enum: [PENDING, IN_PROGRESS, RESOLVED]
          nullable: true
        toStatus: {$ref: '#/components/schemas/ReportStatus'}
        changedBy: {type: string, format: uuid, nullable: true}
        note: {type: string, nullable: true}
        changedAt: {type: string, format: date-time}
    PriorityHistoryEntry:
      type: object
      additionalProperties: false
      required: [toPriority, changedBy, changedAt]
      properties:
        fromPriority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
          nullable: true
        toPriority: {$ref: '#/components/schemas/ReportPriority'}
        fromDueAt: {type: string, format: date-time, nullable: true}
        toDueAt: {type: string, format: date-time, nullable: true}
        changedBy: {type: string, format: uuid}
        changedAt: {type: string, format: date-time}
    TeamSummary:
      type: object
      additionalProperties: false
      required: [id, name, isActive, memberCount, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        isActive: {type: boolean}
        memberCount: {type: integer, format: int32, minimum: 0}
        createdAt: {type: string, format: date-time}
    TeamDetail:
      type: object
      additionalProperties: false
      required: [id, name, isActive, members, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        isActive: {type: boolean}
        members:
          type: array
          items: {$ref: '#/components/schemas/TeamMember'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TeamMember:
      type: object
      additionalProperties: false
      required: [adminUserId, username, joinedAt]
      properties:
        adminUserId: {type: string, format: uuid}
        username: {type: string}
        joinedAt: {type: string, format: date-time}
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string, nullable: true}
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, nullable: true}
        description: {type: string, nullable: true}
        isActive: {type: boolean, nullable: true}
    Assignee:
      type: object
      additionalProperties: false
      required: [adminUserId, username, teamIds]
      properties:
        adminUserId: {type: string, format: uuid}
        username: {type: string}
        teamIds:
          type: array
          items: {type: string, format: uuid}
    Statistics:
      type: object
      additionalProperties: false
      required: [totalReports, byStatus, byCategory, byPriority, byTeam]
      properties:
        totalReports: {type: integer, format: int64, minimum: 0}
        byStatus:
          type: object
          additionalProperties: {type: integer, format: int64, minimum: 0}
        byCategory:
          type: array
          items: {$ref: '#/components/schemas/CategoryCount'}
        byPriority:
          type: object
          additionalProperties: {type: integer, format: int64, minimum: 0}
        byTeam:
          type: array
          items: {$ref: '#/components/schemas/TeamCount'}
    CategoryCount:
      type: object
      additionalProperties: false
      required: [categorySlug, categoryName, count]
      properties:
        categorySlug: {type: string}
        categoryName: {type: string}
        count: {type: integer, format: int64, minimum: 0}
    TeamCount:
      type: object
      additionalProperties: false
      required: [teamId, teamName, count]
      properties:
