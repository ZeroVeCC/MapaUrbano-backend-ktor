openapi: 3.0.3
info:
  title: Mapa Urbano API
  version: 1.2.0
  description: |-
    Contrato HTTP y WebSocket del backend Ktor de Mapa Urbano.

    La autenticación ciudadana vigente usa **DNI + contraseña**. El login devuelve
    un token opaco que debe enviarse como `Authorization: Bearer <token>`.

    Cada operación incluye `x-implementation-status`:

    - `implemented`: disponible en el código actual.
    - `partial`: disponible, con una limitación indicada en la descripción.
    - `stub`: registrada, pero responde HTTP 501.
    - `blocked`: el código existe, pero la autenticación administrativa actual impide usarlo.
    - `placeholder`: responde, aunque todavía no calcula datos reales.

    La API administrativa está documentada para mostrar el contrato completo al
    equipo, pero actualmente está bloqueada: `/api/v1/admin/auth/login` quedó dentro
    del grupo que exige una sesión previa y Ktor Sessions todavía no tiene un
    transporte de cookie instalado. Swagger UI sirve para explorar el contrato; no
    convierte esos endpoints bloqueados en funcionales.

    Los WebSockets aparecen como handshakes HTTP 101. Swagger UI no abre conexiones
    WebSocket; los clientes deben obtener el estado inicial por REST y escuchar luego
    los eventos descritos en `WsEvent`.
  contact:
    name: Equipo Mapa Urbano
servers:
  - url: /
    description: Mismo host y puerto desde el que se abrió Swagger UI
security: []
tags:
  - name: Estado del servidor
    description: Comprobaciones de vida y disponibilidad del proceso.
  - name: Categorías públicas
    description: Catálogo visible para los clientes ciudadanos.
  - name: Reportes públicos
    description: Consulta, creación y seguimiento público de incidencias.
  - name: Cuenta ciudadana
    description: Registro, sesión y datos propios mediante DNI y token Bearer.
  - name: Tiempo real
    description: Handshakes y eventos WebSocket.
  - name: Autenticación administrativa
    description: Sesión por cookie para el panel web; bloqueada en la implementación actual.
  - name: Reportes administrativos
    description: Gestión interna de reportes.
  - name: Equipos y asignaciones
    description: Equipos, miembros, responsables y asignaciones.
  - name: Categorías administrativas
    description: Gestión del catálogo de categorías.
  - name: Estadísticas
    description: Agregados para el panel administrativo.
  - name: Auditoría
    description: Trazabilidad de operaciones administrativas.
paths:
  /health/live:
    get:
      tags: [Estado del servidor]
      operationId: getLiveness
      summary: Comprobar que el proceso está vivo
      x-implementation-status: implemented
      responses:
        '200':
          description: El proceso está ejecutándose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
  /health/ready:
    get:
      tags: [Estado del servidor]
      operationId: getReadiness
      summary: Comprobar que el proceso está listo
      description: Actualmente responde `UP` sin verificar la conexión a PostgreSQL.
      x-implementation-status: partial
      responses:
        '200':
          description: El proceso responde; todavía no garantiza que la base esté disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/categories:
    get:
      tags: [Categorías públicas]
      operationId: listPublicCategories
      summary: Listar categorías activas
      x-implementation-status: implemented
      responses:
        '200':
          description: Catálogo ordenado de categorías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 1f6d61d5-a404-4e7f-a969-882b75148623
                  slug: bache
                  name: Bache
                  colorHex: '#E67E22'
                  isActive: true
                  sortOrder: 10
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/reports:
    get:
      tags: [Reportes públicos]
      operationId: listPublicReports
      summary: Listar reportes visibles en el mapa
      description: |-
        Filtra por rectángulo geográfico, estado y categoría. Si no se envían límites,
        se usa el mundo completo sin construir un polígono antipodal. El parámetro
        `cursor` está registrado, pero el repositorio actual todavía no lo aplica.
      x-implementation-status: partial
      security:
        - {}
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/MinLat'
        - $ref: '#/components/parameters/MinLng'
        - $ref: '#/components/parameters/MaxLat'
        - $ref: '#/components/parameters/MaxLng'
        - $ref: '#/components/parameters/ReportStatusQuery'
        - name: category
          in: query
          description: Slug de categoría, por ejemplo `bache`.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de reportes. `items` puede estar vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPublicPage'
              example:
                items:
                  - id: c8bf2db1-c9fb-43bc-8ab7-86f83f77f7d2
                    title: Luminaria apagada
                    categorySlug: luminaria
                    latitude: -32.8895
                    longitude: -68.8458
                    status: PENDING
                    hasImage: false
                    createdAt: '2026-10-14T18:15:00Z'
                    updatedAt: '2026-10-14T18:15:00Z'
                nextCursor: null
                totalCount: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Reportes públicos]
      operationId: createReport
      summary: Crear un reporte ciudadano
      description: |-
        Recibe `multipart/form-data`. Para `submissionMode=ACCOUNT` se exige un token
        ciudadano válido; para `ANONYMOUS` la respuesta incluye un código de seguimiento
        que se muestra una sola vez. El campo de archivo se llama exactamente `image`.

        La imagen se procesa después de crear el reporte; esa secuencia todavía no es
        una única transacción atómica.
      x-implementation-status: partial
      security:
        - {}
        - userBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateReportMultipart'
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Reporte creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReportResponse'
              examples:
                anonymous:
                  summary: Reporte anónimo
                  value:
                    id: c8bf2db1-c9fb-43bc-8ab7-86f83f77f7d2
                    submissionMode: ANONYMOUS
                    status: PENDING
                    createdAt: '2026-10-14T18:15:00Z'
                    trackingCode: 7Q2K9M4F8A
                account:
                  summary: Reporte asociado a una cuenta
                  value:
                    id: c8bf2db1-c9fb-43bc-8ab7-86f83f77f7d2
                    submissionMode: ACCOUNT
                    status: PENDING
                    createdAt: '2026-10-14T18:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/reports/{id}:
    get:
      tags: [Reportes públicos]
      operationId: getPublicReport
      summary: Consultar el detalle público de un reporte
      description: El DTO admite historial, pero el repositorio actual todavía no lo reconstruye por completo.
      x-implementation-status: partial
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Detalle público sin datos personales del autor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPublicDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/reports/{id}/image:
    get:
      tags: [Reportes públicos]
      operationId: getReportImage
      summary: Descargar la imagen de un reporte
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Bytes originales almacenados, con su tipo de contenido.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/report-status:
    post:
      tags: [Reportes públicos]
      operationId: getReportByTrackingCode
      summary: Consultar un reporte anónimo por código
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingCodeRequest'
            example:
              trackingCode: 7Q2K9M4F8A
      responses:
        '200':
          description: Estado y ubicación del reporte asociado al código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/register:
    post:
      tags: [Cuenta ciudadana]
      operationId: registerCitizen
      summary: Registrar una persona y crear su sesión
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              dni: '30.123.456'
              displayName: Juan Pérez
              password: clave-segura-2026
      responses:
        '201':
          description: Cuenta creada; el token opaco se entrega una sola vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El DNI ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              example:
                error:
                  code: DNI_ALREADY_REGISTERED
                  message: El DNI ya se encuentra registrado.
                  details: []
                  requestId: 7d00b765-56db-43fd-8447-0a910a9861dc
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/login:
    post:
      tags: [Cuenta ciudadana]
      operationId: loginCitizen
      summary: Iniciar sesión con DNI y contraseña
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              dni: '30123456'
              password: clave-segura-2026
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/logout:
    post:
      tags: [Cuenta ciudadana]
      operationId: logoutCitizen
      summary: Revocar el token ciudadano actual
      x-implementation-status: implemented
      security:
        - userBearer: []
      responses:
        '204':
          description: Sesión revocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me:
    get:
      tags: [Cuenta ciudadana]
      operationId: getCitizenProfile
      summary: Consultar el perfil propio
      x-implementation-status: implemented
      security:
        - userBearer: []
      responses:
        '200':
          description: Perfil privado de la sesión actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cuenta ciudadana]
      operationId: deactivateCitizenAccount
      summary: Desactivar la cuenta propia
      description: Desactiva la cuenta y revoca todas sus sesiones.
      x-implementation-status: implemented
      security:
        - userBearer: []
      responses:
        '204':
          description: Cuenta desactivada y sesiones revocadas.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/reports:
    get:
      tags: [Cuenta ciudadana]
      operationId: listOwnReports
      summary: Listar reportes asociados a la cuenta actual
      description: |-
        El endpoint funciona, pero la paginación tiene una incompatibilidad pendiente:
        genera el siguiente cursor con un ID y el repositorio intenta leerlo como fecha.
        Además, el mapeo actual puede enviar el ID de categoría en `categorySlug` y
        devolver `hasImage=false` aunque exista una imagen.
      x-implementation-status: partial
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de reportes pertenecientes a la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPublicPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/reports/{id}:
    get:
      tags: [Cuenta ciudadana]
      operationId: getOwnReport
      summary: Consultar el detalle de un reporte propio
      x-implementation-status: stub
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Contrato previsto para cuando se implemente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPublicDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/ws/public:
    get:
      tags: [Tiempo real]
      operationId: connectPublicWebSocket
      summary: Abrir el canal público de eventos
      description: |-
        Handshake WebSocket. El bus actual vive en memoria, no conserva replay y se
        pierde al reiniciar el proceso. Swagger UI no puede ejecutar este canal.
      x-implementation-status: partial
      x-websocket-events:
        schema:
          $ref: '#/components/schemas/WsEvent'
        server-to-client:
          - connected
          - report.created
          - report.updated
          - report.assignment_changed
          - report.priority_changed
          - report.deleted
          - statistics.updated
          - heartbeat
          - error
      responses:
        '101':
          description: Protocolo cambiado a WebSocket.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/ws/admin:
    get:
      tags: [Tiempo real]
      operationId: connectAdminWebSocket
      summary: Abrir el canal administrativo de eventos
      description: Requiere la sesión administrativa cuya infraestructura está incompleta.
      x-implementation-status: blocked
      security:
        - adminSessionCookie: []
      x-websocket-events:
        schema:
          $ref: '#/components/schemas/WsEvent'
        server-to-client:
          - connected
          - report.created
          - report.updated
          - report.assignment_changed
          - report.priority_changed
          - report.deleted
          - statistics.updated
          - heartbeat
          - error
      responses:
        '101':
          description: Protocolo cambiado a WebSocket.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/auth/login:
    post:
      tags: [Autenticación administrativa]
      operationId: loginAdmin
      summary: Iniciar sesión administrativa
      description: |-
        Contrato previsto para el panel web. Actualmente la ruta exige una sesión
        administrativa antes de ejecutar el login y no hay transporte de cookie
        configurado, por lo que el flujo no puede completarse.
      x-implementation-status: blocked
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Datos mínimos del administrador autenticado; la cookie debe ser emitida por el servidor.
          headers:
            Set-Cookie:
              description: Cookie de sesión administrativa; todavía no se emite en la implementación actual.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/auth/logout:
    post:
      tags: [Autenticación administrativa]
      operationId: logoutAdmin
      summary: Cerrar la sesión administrativa
      x-implementation-status: blocked
      security:
        - adminSessionCookie: []
      responses:
        '204':
          description: Sesión administrativa cerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/auth/me:
    get:
      tags: [Autenticación administrativa]
      operationId: getAdminProfile
      summary: Consultar la sesión administrativa actual
      x-implementation-status: blocked
      security:
        - adminSessionCookie: []
      responses:
        '200':
          description: Administrador de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/reports:
    get:
      tags: [Reportes administrativos]
      operationId: listAdminReports
      summary: Listar reportes para el panel administrativo
      description: La ruta está registrada, pero responde HTTP 501.
      x-implementation-status: stub
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportStatusQuery'
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/ReportPriority'
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: responsibleAdminUserId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Contrato previsto para el listado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAdminPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/admin/reports/{id}:
    get:
      tags: [Reportes administrativos]
      operationId: getAdminReport
      summary: Consultar el detalle administrativo de un reporte
      x-implementation-status: stub
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Contrato previsto para el detalle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAdminDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags: [Reportes administrativos]
      operationId: deleteAdminReport
      summary: Eliminar lógicamente un reporte
      description: El caso de uso existe, pero depende de la autenticación administrativa bloqueada.
      x-implementation-status: blocked
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '204':
          description: Reporte eliminado lógicamente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/reports/{id}/status:
    patch:
      tags: [Reportes administrativos]
      operationId: updateReportStatus
      summary: Cambiar el estado de un reporte
      description: |-
        Usa control optimista mediante `version`, registra historial y publica un evento.
        La respuesta HTTP actual intenta serializar el objeto de dominio directamente;
        debe reemplazarse por un DTO estable antes de que el panel dependa del cuerpo.
      x-implementation-status: blocked
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Cambio aplicado. El cuerpo actual es provisional y no forma parte del contrato estable.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/reports/{id}/priority:
    patch:
      tags: [Reportes administrativos]
      operationId: updateReportPriority
      summary: Cambiar prioridad y fecha objetivo
      x-implementation-status: blocked
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePriorityRequest'
      responses:
        '204':
          description: Prioridad actualizada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/reports/{id}/assignment:
    put:
      tags: [Equipos y asignaciones]
      operationId: assignReport
      summary: Asignar un reporte a equipo o responsable
      x-implementation-status: blocked
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '204':
          description: Asignación creada o reemplazada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Equipos y asignaciones]
