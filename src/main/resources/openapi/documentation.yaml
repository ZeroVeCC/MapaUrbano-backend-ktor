components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: Token opaco de 30 días entregado por registro o login. No es el DNI ni el UUID del usuario.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: admin_session
      description: Contrato objetivo para la sesión del panel; el transporte de cookie todavía no está configurado.
  parameters:
    ReportId:
      name: id
      in: path
      required: true
      description: UUID del reporte.
      schema:
        type: string
        format: uuid
    TeamId:
      name: id
      in: path
      required: true
      description: UUID del equipo.
      schema:
        type: string
        format: uuid
    TeamIdNamed:
      name: teamId
      in: path
      required: true
      description: UUID del equipo.
      schema:
        type: string
        format: uuid
    AdminUserId:
      name: adminUserId
      in: path
      required: true
      description: UUID del administrador.
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      description: UUID de la categoría.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto por la página anterior. Algunos listados aún no lo aplican correctamente.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MinLat:
      name: minLat
      in: query
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
        default: -90
    MinLng:
      name: minLng
      in: query
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
        default: -180
    MaxLat:
      name: maxLat
      in: query
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
        default: 90
    MaxLng:
      name: maxLng
      in: query
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
        default: 180
    ReportStatusQuery:
      name: status
      in: query
      description: Estado; la implementación acepta el texto sin distinguir mayúsculas y minúsculas.
      schema:
        $ref: '#/components/schemas/ReportStatus'
  responses:
    BadRequest:
      description: Parámetros, cuerpo o reglas de negocio inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            error:
              code: VALIDATION_ERROR
              message: Hay datos inválidos.
              details:
                - field: latitude
                  reason: Debe estar entre -90 y 90.
              requestId: 7d00b765-56db-43fd-8447-0a910a9861dc
    Unauthorized:
      description: Credenciales o sesión ausentes, inválidas, vencidas o revocadas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    NotFound:
      description: El recurso solicitado no existe o no es visible para la sesión.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    Conflict:
      description: Duplicado, transición inválida o conflicto de versión optimista.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    TooManyRequests:
      description: Se superó el límite de solicitudes. El cuerpo del limitador actual no es un contrato estable.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar, si el servidor lo informa.
          schema:
            type: integer
    InternalError:
      description: Fallo interno traducido a un mensaje controlado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: No pudimos procesar la solicitud.
              details: []
              requestId: 7d00b765-56db-43fd-8447-0a910a9861dc
    NotImplemented:
      description: Ruta registrada cuyo caso de uso todavía no está implementado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            error:
              code: ENDPOINT_NOT_IMPLEMENTED
              message: El endpoint todavía no está implementado.
              details: []
              requestId: 7d00b765-56db-43fd-8447-0a910a9861dc
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    ReportStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, RESOLVED]
      example: PENDING
    ReportPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
      example: MEDIUM
    SubmissionMode:
      type: string
      enum: [ACCOUNT, ANONYMOUS]
      example: ANONYMOUS
    ApiErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Hay datos inválidos.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
        requestId:
          type: string
          example: 7d00b765-56db-43fd-8447-0a910a9861dc
    ApiErrorDetail:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        field:
          type: string
          nullable: true
        reason:
          type: string
    Category:
      type: object
      additionalProperties: false
      required: [id, slug, name, colorHex, isActive, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          example: bache
        name:
          type: string
          example: Bache
        colorHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#E67E22'
        isActive:
          type: boolean
        sortOrder:
          type: integer
          format: int32
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [slug, name, colorHex]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        name:
          type: string
        colorHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        sortOrder:
          type: integer
          format: int32
          nullable: true
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
        colorHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
        isActive:
          type: boolean
          nullable: true
        sortOrder:
          type: integer
          format: int32
          nullable: true
    CreateReportMultipart:
      type: object
      additionalProperties: false
      required: [title, description, categorySlug, latitude, longitude, submissionMode]
      properties:
        title:
          type: string
          minLength: 1
          example: Luminaria apagada
        description:
          type: string
          minLength: 1
          example: La luminaria no funciona desde hace tres noches.
        categorySlug:
          type: string
          example: luminaria
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -32.8895
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -68.8458
        submissionMode:
          $ref: '#/components/schemas/SubmissionMode'
        image:
          type: string
          format: binary
          description: Archivo opcional. El nombre de la parte debe ser `image`.
    CreateReportResponse:
      type: object
      additionalProperties: false
      required: [id, submissionMode, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        submissionMode:
          $ref: '#/components/schemas/SubmissionMode'
        status:
          $ref: '#/components/schemas/ReportStatus'
        createdAt:
          type: string
          format: date-time
        trackingCode:
          type: string
          nullable: true
          description: Solo se entrega al crear un reporte anónimo.
          example: 7Q2K9M4F8A
    ReportPublicSummary:
      type: object
      additionalProperties: false
      required: [id, title, categorySlug, latitude, longitude, status, hasImage, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        categorySlug:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/ReportStatus'
        hasImage:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReportPublicDetail:
      allOf:
        - $ref: '#/components/schemas/ReportPublicSummary'
        - type: object
          required: [description, categoryName, statusHistory]
          properties:
            description:
              type: string
            categoryName:
              type: string
            statusHistory:
              type: array
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
    StatusHistoryEntry:
      type: object
      additionalProperties: false
      required: [toStatus, changedAt]
      properties:
        fromStatus:
          type: string
          enum: [PENDING, IN_PROGRESS, RESOLVED]
          nullable: true
        toStatus:
          $ref: '#/components/schemas/ReportStatus'
        changedAt:
          type: string
          format: date-time
    TrackingCodeRequest:
      type: object
      additionalProperties: false
      required: [trackingCode]
      properties:
        trackingCode:
          type: string
          minLength: 1
          example: 7Q2K9M4F8A
    TrackingCodeResponse:
      type: object
      additionalProperties: false
      required: [id, status, categorySlug, latitude, longitude, hasImage, createdAt, updatedAt, statusHistory]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ReportStatus'
        categorySlug:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        hasImage:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistoryEntry'
    ReportPublicPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportPublicSummary'
        nextCursor:
          type: string
          nullable: true
        totalCount:
          type: integer
          format: int64
          nullable: true
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [dni, displayName, password]
      properties:
        dni:
          type: string
          example: '30.123.456'
          description: Se normaliza a 7 u 8 dígitos; acepta puntos agrupados y espacios exteriores, y rechaza todos ceros.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: Máximo 72 bytes UTF-8 por el límite de BCrypt.
    RegisterResponse:
      type: object
      additionalProperties: false
      required: [id, token]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Token opaco para Authorization Bearer.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [dni, password]
      properties:
        dni:
          type: string
          example: '30123456'
        password:
          type: string
          format: password
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, userId]
      properties:
        token:
          type: string
        userId:
          type: string
          format: uuid
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        dni:
          type: string
          nullable: true
          pattern: '^[0-9]{7,8}$'
        createdAt:
          type: string
          format: date-time
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    AdminLoginResponse:
      type: object
      additionalProperties: false
      required: [adminUserId, username]
      properties:
        adminUserId:
          type: string
          format: uuid
        username:
          type: string
    AdminSessionResponse:
      type: object
      additionalProperties: false
      required: [adminUserId]
      properties:
        adminUserId:
          type: string
          format: uuid
    UpdateStatusRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          $ref: '#/components/schemas/ReportStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        note:
          type: string
          nullable: true
    UpdatePriorityRequest:
      type: object
      additionalProperties: false
      required: [priority, version]
      properties:
        priority:
          $ref: '#/components/schemas/ReportPriority'
        dueAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
    AssignmentRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        teamId:
          type: string
          format: uuid
          nullable: true
        responsibleAdminUserId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
    ReportAdminSummary:
      type: object
      additionalProperties: false
      required: [id, title, categorySlug, categoryName, status, priority, latitude, longitude, hasImage, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        categorySlug: {type: string}
        categoryName: {type: string}
        status: {$ref: '#/components/schemas/ReportStatus'}
        priority: {$ref: '#/components/schemas/ReportPriority'}
        dueAt: {type: string, format: date-time, nullable: true}
        teamName: {type: string, nullable: true}
        responsibleAdminName: {type: string, nullable: true}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        hasImage: {type: boolean}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ReportAdminDetail:
      type: object
      additionalProperties: false
      required: [id, title, description, categorySlug, categoryName, status, priority, submissionMode, latitude, longitude, hasImage, version, createdAt, updatedAt, statusHistory, priorityHistory]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        categorySlug: {type: string}
        categoryName: {type: string}
        status: {$ref: '#/components/schemas/ReportStatus'}
        priority: {$ref: '#/components/schemas/ReportPriority'}
        dueAt: {type: string, format: date-time, nullable: true}
        submissionMode: {$ref: '#/components/schemas/SubmissionMode'}
        assignment:
          type: object
          allOf:
            - $ref: '#/components/schemas/AssignmentInfo'
          nullable: true
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        hasImage: {type: boolean}
        imageChecksum: {type: string, nullable: true}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        statusHistory:
          type: array
          items: {$ref: '#/components/schemas/AdminStatusHistoryEntry'}
        priorityHistory:
          type: array
          items: {$ref: '#/components/schemas/PriorityHistoryEntry'}
    ReportAdminPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReportAdminSummary'}
        nextCursor: {type: string, nullable: true}
        totalCount: {type: integer, format: int64, nullable: true}
    AssignmentInfo:
      type: object
      additionalProperties: false
      required: [assignedBy, assignedAt]
      properties:
        teamId: {type: string, format: uuid, nullable: true}
        teamName: {type: string, nullable: true}
        responsibleAdminUserId: {type: string, format: uuid, nullable: true}
        responsibleAdminName: {type: string, nullable: true}
        assignedBy: {type: string, format: uuid}
        assignedAt: {type: string, format: date-time}
    AdminStatusHistoryEntry:
      type: object
      additionalProperties: false
      required: [toStatus, changedAt]
      properties:
        fromStatus:
          type: string
          enum: [PENDING, IN_PROGRESS, RESOLVED]
          nullable: true
        toStatus: {$ref: '#/components/schemas/ReportStatus'}
        changedBy: {type: string, format: uuid, nullable: true}
        note: {type: string, nullable: true}
        changedAt: {type: string, format: date-time}
    PriorityHistoryEntry:
      type: object
      additionalProperties: false
      required: [toPriority, changedBy, changedAt]
      properties:
        fromPriority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
          nullable: true
        toPriority: {$ref: '#/components/schemas/ReportPriority'}
        fromDueAt: {type: string, format: date-time, nullable: true}
        toDueAt: {type: string, format: date-time, nullable: true}
        changedBy: {type: string, format: uuid}
        changedAt: {type: string, format: date-time}
    TeamSummary:
      type: object
      additionalProperties: false
      required: [id, name, isActive, memberCount, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        isActive: {type: boolean}
        memberCount: {type: integer, format: int32, minimum: 0}
        createdAt: {type: string, format: date-time}
    TeamDetail:
      type: object
      additionalProperties: false
      required: [id, name, isActive, members, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        isActive: {type: boolean}
        members:
          type: array
          items: {$ref: '#/components/schemas/TeamMember'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TeamMember:
      type: object
      additionalProperties: false
      required: [adminUserId, username, joinedAt]
      properties:
        adminUserId: {type: string, format: uuid}
        username: {type: string}
        joinedAt: {type: string, format: date-time}
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string, nullable: true}
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, nullable: true}
        description: {type: string, nullable: true}
        isActive: {type: boolean, nullable: true}
    Assignee:
      type: object
      additionalProperties: false
      required: [adminUserId, username, teamIds]
      properties:
        adminUserId: {type: string, format: uuid}
        username: {type: string}
        teamIds:
          type: array
          items: {type: string, format: uuid}
    Statistics:
      type: object
      additionalProperties: false
      required: [totalReports, byStatus, byCategory, byPriority, byTeam]
      properties:
        totalReports: {type: integer, format: int64, minimum: 0}
        byStatus:
          type: object
          additionalProperties: {type: integer, format: int64, minimum: 0}
        byCategory:
          type: array
          items: {$ref: '#/components/schemas/CategoryCount'}
        byPriority:
          type: object
          additionalProperties: {type: integer, format: int64, minimum: 0}
        byTeam:
          type: array
          items: {$ref: '#/components/schemas/TeamCount'}
    CategoryCount:
      type: object
      additionalProperties: false
      required: [categorySlug, categoryName, count]
      properties:
        categorySlug: {type: string}
        categoryName: {type: string}
        count: {type: integer, format: int64, minimum: 0}
    TeamCount:
      type: object
      additionalProperties: false
      required: [teamId, teamName, count]
      properties:
        teamId: {type: string, format: uuid}
        teamName: {type: string}
        count: {type: integer, format: int64, minimum: 0}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, action, entityType, occurredAt]
      properties:
        id: {type: string, format: uuid}
        actorAdminUserId: {type: string, format: uuid, nullable: true}
        actorUserId: {type: string, format: uuid, nullable: true}
        action: {type: string}
        entityType: {type: string}
        entityId: {type: string, format: uuid, nullable: true}
        metadata:
          type: object
          nullable: true
          description: Cualquier valor JSON asociado al evento.
          additionalProperties: true
        sourceIp: {type: string, nullable: true}
        occurredAt: {type: string, format: date-time}
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEvent'}
        nextCursor: {type: string, nullable: true}
        totalCount: {type: integer, format: int64, nullable: true}
    WsEvent:
      type: object
      additionalProperties: false
      required: [type, occurredAt]
      properties:
        type:
          type: string
          enum:
            - connected
            - report.created
            - report.updated
            - report.assignment_changed
            - report.priority_changed
            - report.deleted
            - statistics.updated
            - heartbeat
            - error
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          nullable: true
          description: Objeto JSON cuyo contenido depende de `type`.
          additionalProperties: true
