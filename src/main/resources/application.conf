ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ com.mapaurbano.application.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/mapa_urbano"
    url = ${?DATABASE_JDBC_URL}
    user = "postgres"
    user = ${?DATABASE_USER}
    password = "password"
    password = ${?DATABASE_PASSWORD}
}

security {
    session {
        secret = "local-development-secret-change-me"
        secret = ${?SESSION_SECRET}
        secureCookie = false
        secureCookie = ${?SESSION_SECURE_COOKIE}
    }
    cors {
        allowedHosts = "localhost:3000,localhost:4200,localhost:5173"
        allowedHosts = ${?CORS_ALLOWED_HOSTS}
    }
    adminBootstrap {
        username = ${?ADMIN_BOOTSTRAP_USERNAME}
        password = ${?ADMIN_BOOTSTRAP_PASSWORD}
    }
}
