ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ com.mapaurbano.application.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/mapa_urbano"
    url = ${?DATABASE_JDBC_URL}
    user = "postgres"
    user = ${?DATABASE_USER}
    password = "password"
    password = ${?DATABASE_PASSWORD}
}

security {
    session {
        secret = "secret-key"
        secret = ${?SESSION_SECRET}
    }
}
