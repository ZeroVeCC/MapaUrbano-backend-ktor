name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Ejecuta compilacion y todas las pruebas (unitarias y de integracion con Testcontainers)
        run: ./gradlew build --no-daemon

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # siempre publicar el reporte, incluso si fallan los tests
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
